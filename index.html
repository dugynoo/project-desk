<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Desk</title>
  </head>
  <body>
    <div id="app">
      <nav id="sidebar-rail" hidden></nav>
      <aside id="sidebar">
        <header class="sidebar-head">
          <span class="brand">Project Desk</span>
          <span class="head-actions">
            <button id="btn-palette" class="icon" data-i18n-title="actions.palette"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 5 6 5-6 5m9 0h7"/></svg></button>
            <button id="btn-templates" class="icon" data-i18n-title="html.templates"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7m-7 4h5"/></svg></button>
            <button id="btn-text-editor" class="icon" data-i18n-title="textEditor.open">✎</button>
            <button id="btn-autohide" class="icon" data-i18n-title="sidebar.autoHide" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button>
            <button id="btn-settings" class="icon" data-i18n-title="html.settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
          </span>
        </header>
        <div class="sidebar-tools">
          <button id="btn-switch" class="sidebar-search" data-i18n="sidebar.search"></button>
          <button id="btn-grid" class="icon" data-i18n-title="sidebar.layout" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg></button>
        </div>
        <div id="attention"></div>
        <div id="projects"></div>
        <button id="btn-update" class="update" hidden></button>
        <button id="btn-add-project" class="add-project" data-i18n="html.addProject"></button>
        <footer id="sidebar-footer"></footer>
      </aside>
      <div id="resizer" data-i18n-title="html.resizer"></div>
      <div id="workspace">
      <main id="stage">
        <div id="empty" class="empty">
          <p data-i18n="html.empty"></p>
          <p class="hint" data-i18n="html.hint"></p>
        </div>
      </main>
      </div>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

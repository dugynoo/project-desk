<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Desk</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="sidebar-head">
          <span class="brand">Project Desk</span>
          <span class="head-actions">
            <button id="btn-switch" class="icon" data-i18n-title="html.switch">⌕</button>
            <button id="btn-templates" class="icon" data-i18n-title="html.templates">✦</button>
            <button id="btn-grid" class="icon" data-i18n-title="html.grid">⊞</button>
            <button id="btn-settings" class="icon" data-i18n-title="html.settings">⚙</button>
          </span>
        </header>
        <div id="attention" aria-live="polite"></div>
        <div id="projects"></div>
        <button id="btn-update" class="update" hidden></button>
        <button id="btn-add-project" class="add-project" data-i18n="html.addProject"></button>
      </aside>
      <div id="resizer" data-i18n-title="html.resizer"></div>
      <main id="stage">
        <div id="empty" class="empty">
          <p data-i18n="html.empty"></p>
          <p class="hint" data-i18n="html.hint"></p>
        </div>
      </main>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

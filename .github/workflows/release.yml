# Vydanie: npm run release (verzia podľa commitov, commit, tag a push; pozri scripts/release.mjs).
# Workflow zbuilduje appku pre Windows, macOS a Linux do konceptu vydania (draft) a po úspechu
# všetkých buildov ho zverejní; až potom si appky aktualizáciu nájdu.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.6.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Pin release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.source.outputs.commit }}

  build:
    needs: source
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version $version in package.json"
            exit 1
          fi

      # Curated user-facing summary, committed before tagging the release.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          test -s RELEASE_NOTES.md
          {
            echo "body<<EOF_NOTES"
            cat RELEASE_NOTES.md
            echo
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Project Desk ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # Parallel builds overwrote each other's platforms; the manifest job writes it once.
          uploadUpdaterJson: false
          args: --config src-tauri/tauri.release.json ${{ matrix.args }}

      - name: Build and verify Arch Linux package
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-arch.sh

      - name: Verify RPM on Fedora and openSUSE
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/verify-rpm.sh

      - name: Prepare downloadable AUR source package
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/build-aur.mjs

      - name: Attach Arch Linux package to draft release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/arch/*.pkg.tar.zst src-tauri/target/release/bundle/aur/*.tar.gz --clobber

  # Updater manifest from the finished draft: every build has uploaded its
  # bundle and signature by now, so no platform can be lost to a race.
  manifest:
    needs: [source, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/updater-manifest.mjs

  # Builds and full CI test the same pinned commit, in parallel. A failed,
  # skipped or cancelled prerequisite prevents publishing (default success()).
  # Manual rebuilds of an older tag must not become the latest release.
  publish:
    needs: [checks, manifest]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Updater manifest covers every platform
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP"
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url' "$RUNNER_TEMP/latest.json" > /dev/null \
              || { echo "::error::latest.json is missing $platform"; exit 1; }
          done
          test "$(jq -r .version "$RUNNER_TEMP/latest.json")" = "${RELEASE_TAG#v}"
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

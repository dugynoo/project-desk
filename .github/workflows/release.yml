# Vydanie: npm version 0.2.0 (zvýši verziu, commitne a vytvorí tag v0.2.0), potom git push --follow-tags.
# Workflow zbuilduje appku pre Windows, macOS a Linux a vytvorí koncept vydania (draft).
# Appky si aktualizáciu nájdu, až keď koncept na GitHube zverejníš.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.6.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # kvôli predošlému tagu v release notes

      - name: Tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version $version in package.json"
            exit 1
          fi

      # Commity od predošlého tagu. Appka ich ukáže pri ponuke aktualizácie (riadky začínajúce „- “).
      - name: Release notes
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          {
            echo "body<<EOF_NOTES"
            echo "Windows, macOS and AppImage installs update themselves. Debian/Ubuntu: install the .deb with apt. Arch: install the .pkg.tar.zst with pacman -U. Fedora/openSUSE: install the .rpm with dnf/zypper. Project Desk checks for new versions on all these formats. Restart the app after updating a system package."
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$RELEASE_TAG" | grep -Ev '^- chore: release [0-9]' || true
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Project Desk ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: --config src-tauri/tauri.release.json ${{ matrix.args }}

      - name: Build and verify Arch Linux package
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-arch.sh

      - name: Verify RPM on Fedora and openSUSE
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/verify-rpm.sh

      - name: Prepare downloadable AUR source package
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/build-aur.mjs

      - name: Attach Arch Linux package to draft release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/arch/*.pkg.tar.zst src-tauri/target/release/bundle/aur/*.tar.gz --clobber
